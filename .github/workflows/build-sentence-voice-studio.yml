name: Build Sentence Voice Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/sentence-voice-studio
    paths:
      - "sentence-voice-studio/**"
      - ".github/workflows/build-sentence-voice-studio.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sentence-voice-studio/**"
      - ".github/workflows/build-sentence-voice-studio.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: sentence-voice-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SentenceVoiceStudio --collect-all edge_tts sentence_voice_studio.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SentenceVoiceStudio-Windows
          path: sentence-voice-studio/dist/SentenceVoiceStudio.exe
          if-no-files-found: error
          retention-days: 30
