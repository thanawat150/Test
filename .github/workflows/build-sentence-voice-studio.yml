name: Build Sentence Voice Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/sentence-voice-studio
    paths:
      - "sentence-voice-studio/**"
      - ".github/workflows/build-sentence-voice-studio.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sentence-voice-studio/**"
      - ".github/workflows/build-sentence-voice-studio.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: sentence-voice-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SentenceVoiceStudio --collect-all edge_tts sentence_voice_studio.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SentenceVoiceStudio-Windows
          path: sentence-voice-studio/dist/SentenceVoiceStudio.exe
          if-no-files-found: error
          retention-days: 30


  build-master-edit-studio:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: master-edit-studio

    steps:
      - name: Checkout Master Edit Studio
        uses: actions/checkout@v4
        with:
          ref: feature/master-edit-studio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Verify FFmpeg capabilities
        shell: pwsh
        run: |
          python -c "import imageio_ffmpeg, os; p=imageio_ffmpeg.get_ffmpeg_exe(); print(p); assert os.path.exists(p)"
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          $filters = & $ffmpeg -hide_banner -filters 2>&1 | Out-String
          if ($filters -notmatch "subtitles") { throw "Bundled FFmpeg lacks subtitles/libass filter" }
          if ($filters -notmatch "overlay") { throw "Bundled FFmpeg lacks overlay filter" }

      - name: Build Master Edit Studio
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MasterEditStudio --collect-all imageio_ffmpeg --collect-all python_calamine master_edit_studio.py

      - name: Upload Master Edit Studio
        uses: actions/upload-artifact@v4
        with:
          name: MasterEditStudio-Windows
          path: master-edit-studio/dist/MasterEditStudio.exe
          if-no-files-found: error
          retention-days: 30
